services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2

    restart: unless-stopped

    command: sh -c "apk add --no-cache nss-tools && caddy run --config /etc/caddy/Caddyfile"

    ports:
      - "80:80"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile

      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  postgres-data: