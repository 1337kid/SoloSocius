services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 2s
      timeout: 2s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile

    environment:
      DATABASE_URL: ${DATABASE_URL}
      DOMAIN: ${DOMAIN}
      PORT: 4000
      NODE_ENV: ${NODE_ENV}
      REDIS_URL: ${REDIS_URL}
      STORAGE_PUBLIC_MEDIA_URL: ${STORAGE_PUBLIC_MEDIA_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile

    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}

    depends_on:
      - backend

  caddy:
    image: caddy:2

    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    command: sh -c "apk add --no-cache nss-tools && caddy run --config /etc/caddy/Caddyfile"

    ports:
      - "80:80"
      - "8443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

      - caddy_data:/data
      - caddy_config:/config

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres-data:
  redis-data: